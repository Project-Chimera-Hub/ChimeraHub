<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2BE3C6" />
    <meta name="description" content="GOATED Relational n-Back — abstract relationship working-memory training." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GOATED n-Back" />
    <link rel="manifest" href="manifest.json" />
    <title>GOATED Relational n-Back</title>
    <script>
      // Theme bootstrap — runs before React mounts so the user never sees
      // a flash of the wrong theme. Saved preference wins; otherwise dark
      // (matches the long-standing default look).
      (function () {
        try {
          var t = localStorage.getItem('nback_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
