<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    /*
     * Apply the saved theme before the app boots.
     *
     * Angular cannot do this until it has loaded, which is long enough to show
     * a frame of the stylesheet's default palette. These are the declarations
     * ThemeService last resolved, replayed verbatim — the mapping from theme
     * keys to custom properties stays in that one file.
     */
    try {
      var themeVars = JSON.parse(localStorage.getItem('syllogimous-theme-vars') || 'null');
      if (themeVars) {
        for (var name in themeVars) {
          document.documentElement.style.setProperty(name, themeVars[name]);
        }
      }
    } catch (e) { /* corrupt or unavailable storage: fall back to the defaults */ }
  </script>
  <title>Loosh Syllogimous</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- SVG first: browsers that understand it prefer it, and it is the only
       one that stays sharp at every size. The rest are the fallback set. -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  <!-- Nothing here is fetched from anywhere: no analytics, no icon CDN. The
       three Font Awesome icons the app used are Bootstrap Icons now, which
       are bundled (angular.json). It runs offline, as the hub and its APK do. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>
