# The Android build.
#
# Not on every push: the site deploys on every push and an APK is not something
# anyone wants forty of. This runs when asked — the "Run workflow" button on the
# Actions tab — and on a version tag, which is the moment a build is worth
# keeping.
#
# The runner already carries a JDK and the Android SDK, which is the whole
# reason this exists: it means nobody has to install either to get the file.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a release under this tag (e.g. v0.2.0); leave empty for just the artifact"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # The two apps with lockfiles; the site build needs both, and the
          # wrapper's own lockfile does not exist until npm writes one.
          cache: npm
          cache-dependency-path: |
            apps/syllogimous/package-lock.json
            apps/precision/package-lock.json

      # Capacitor 6's Gradle wants 17 or newer. The runner has several; pin one
      # rather than inherit whichever is default this month.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the APK
        run: tools/build-apk.sh

      # Always, not just on a tag: the point of the button is to get the file.
      - uses: actions/upload-artifact@v4
        with:
          name: mindbuild-apk
          path: apk/mindbuild-debug.apk
          if-no-files-found: error

      # On a tag, it also becomes something with a permanent address. A manual
      # run can ask for the same by naming a tag, which the release creates at
      # the commit that was built — the way to get a release from a phone, where
      # pushing a tag is not something the browser offers. A release asset is
      # the .apk itself; an Actions artifact needs a login and arrives zipped.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: apk/mindbuild-debug.apk
          generate_release_notes: true
